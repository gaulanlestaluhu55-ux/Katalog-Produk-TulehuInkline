<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tulehu Inkline — Sablon Kaos Custom</title>
  <meta name="description" content="Tulehu Inkline — sablon kaos custom Negeri Tulehu, Maluku Tengah. Lihat katalog, Instagram, dan Shopee kami." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ── Landing link-in-bio (bold hero + foto) ── */
    .landing-hero {
      position: relative; min-height: 100vh; min-height: 100svh;
      display: flex; align-items: center; justify-content: center;
      background: var(--ink); overflow: hidden;
    }
    .landing-bg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center;
    }
    .landing-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(10,10,10,.55) 0%, rgba(10,10,10,.35) 40%, rgba(10,10,10,.78) 100%);
    }
    .landing-content {
      position: relative; z-index: 1; width: 100%; max-width: 440px;
      padding: 3rem 1.5rem 2.5rem; text-align: center; color: #fff;
    }
    .landing-content h1 { font-size: clamp(1.8rem, 6vw, 2.6rem); font-weight: 700; letter-spacing: -0.5px; line-height: 1.15; }
    .landing-content .tagline { margin: 0.6rem 0 1.8rem; font-size: 14px; color: rgba(255,255,255,.82); }
    .landing-links { display: flex; flex-direction: column; gap: 10px; }
    .landing-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 52px; padding: 0 18px; border-radius: 16px;
      font-size: 15px; font-weight: 600; text-decoration: none;
      transition: transform 0.12s, background 0.15s;
    }
    .landing-btn:active { transform: scale(0.98); }
    .landing-btn.primary { background: #fff; color: var(--ink); }
    .landing-btn.primary:hover { background: #f0f0ee; }
    .landing-btn.ghost {
      background: rgba(255,255,255,.12); color: #fff;
      border: 1px solid rgba(255,255,255,.4); backdrop-filter: blur(6px);
    }
    .landing-btn.ghost:hover { background: rgba(255,255,255,.22); }
    .landing-foot { margin-top: 1.8rem; font-size: 12px; color: rgba(255,255,255,.65); }
  </style>
</head>
<body>

<main class="landing-hero">
  <!-- Hero responsif: mobile/desktop dari CONFIG.landing -->
  <picture>
    <source id="heroSrcMobile" media="(max-width: 767px)" />
    <img class="landing-bg" id="heroImg" alt="Sablon kaos Tulehu Inkline" />
  </picture>
  <div class="landing-overlay"></div>
  <div class="landing-content">
    <img src="icon-192.png" alt="Logo Tulehu Inkline" width="88" height="88" style="border-radius:24px;display:block;margin:0 auto 1rem" />
    <h1>Tulehu Inkline</h1>
    <p class="tagline">Sablon kaos custom · Negeri Tulehu, Maluku Tengah</p>
    <div class="landing-links">
      <a class="landing-btn primary" href="katalog.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span>Katalog Produk</span>
      </a>
      <a class="landing-btn ghost" id="igBtn" href="#" target="_blank" rel="noopener">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
        <span>Instagram</span>
      </a>
      <a class="landing-btn ghost" id="shopeeBtn" href="#" target="_blank" rel="noopener">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span>Shopee</span>
      </a>
    </div>
    <div class="landing-foot">&copy; 2026 Tulehu Inkline</div>
  </div>
</main>

<script src="js/config.js"></script>
<script>
  /* Link + foto dibaca dari CONFIG.landing (satu-satunya tempat edit) */
  (function () {
    var landing = (window.CONFIG && CONFIG.landing) || {};
    if (landing.instagram) document.getElementById('igBtn').href = landing.instagram;
    if (landing.shopee) document.getElementById('shopeeBtn').href = landing.shopee;
    var hero = document.getElementById('heroImg');
    var heroSrc = document.getElementById('heroSrcMobile');
    var heroUrl = landing.heroDesktop || landing.heroImage;
    hero.onerror = function () { hero.remove(); };
    if (heroUrl) {
      if (landing.heroMobile && heroSrc) heroSrc.srcset = landing.heroMobile;
      hero.src = heroUrl;
    } else {
      hero.remove();
    }
  })();
</script>
</body>
</html>
