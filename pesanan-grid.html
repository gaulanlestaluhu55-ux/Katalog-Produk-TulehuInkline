<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a1a1a" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Pesanan Grid — Katalog Sablon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="css/admin.css" rel="stylesheet" />
  <style>
    /* ── Grid spreadsheet (fase 3, reuse token admin.css) ── */
    .grid-card { margin-bottom: 0; }
    .table-wrap { max-height: none; overflow-x: auto; }
    /* Scrollbar horizontal atas (sinkron dua arah via render.js) */
    .table-xscroll { overflow-x: auto; overflow-y: hidden; margin-bottom: 8px; }
    #gridTopSpacer { height: 1px; }
    thead th { position: sticky; top: 0; z-index: 2; }
    td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    td .sub { display: block; font-size: 11px; color: var(--ink-muted); white-space: nowrap; }
    .cell-num {
      width: 110px; height: 30px; padding: 0 8px;
      border: 1px solid var(--border); border-radius: 8px;
      font-family: inherit; font-size: 12px; text-align: right;
      outline: none; background: var(--surface); color: var(--ink);
    }
    .cell-num:focus { border-color: var(--ink); }
    .cell-num:disabled, select:disabled { opacity: 0.45; }
    .cell-saving { border-color: var(--info-text) !important; }
    .cell-saved { border-color: var(--accent-text) !important; }
    .cell-error { border-color: var(--err-text) !important; }
    #gridNewRow td { background: var(--accent-bg); }
    /* Mobile = kartu stacked, tabel hanya desktop */
    #gridCards { display: flex; flex-direction: column; gap: 10px; }
    #gridCards .order-row {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px;
    }
    #gridCards .order-top { display: flex; justify-content: space-between; gap: 10px; }
    #gridCards .order-name { font-size: 14px; font-weight: 600; }
    #gridCards .order-meta { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
    #gridCards .order-total { font-size: 14px; font-weight: 600; white-space: nowrap; }
    #gridCards .order-badges { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    #gridCards .order-edit { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: end; }
    #gridCards .order-edit label {
      font-size: 11px; color: var(--ink-muted);
      display: flex; flex-direction: column; gap: 4px;
    }
    #gridCards .order-pay { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
    #gridCards .order-pay b { color: var(--ink); }
    /* Modal riwayat bayar (F2) */
    #payHistModal { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
    #payHistModal[hidden] { display: none; }
    .hist-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); max-width: 520px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 16px 18px; }
    .hist-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .hist-head h3 { margin: 0; font-size: 15px; }
    .hist-row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px; }
    .hist-row .sub { display: block; font-size: 11px; color: var(--ink-muted); }
    .hist-pos { color: var(--accent-text); }
    .hist-neg { color: var(--err-text); }
    .hist-meta { text-align: right; font-size: 12px; }
    @media (max-width: 767px) { #gridTableCard, #addRowBtn { display: none; } }
    @media (min-width: 768px) {
      #gridCards { display: none; }
      /* Grid full-width: lepas kunci 1200px .container, gutter konsisten 28px.
         Toolbar (h2/filter/+Baris) ikut melebar karena di dalam .container. */
      .container { max-width: none; padding-left: 28px; padding-right: 28px; }
      #gridTable { min-width: 1200px; }
    }
  </style>
</head>

<body>

  <!-- ═══ APP ═══ -->
  <div class="admin-app" id="adminApp">
    <header>
      <div class="header-inner">
        <div class="brand">Pesanan Grid<div class="brand-sub">Tulehu Inkline · beta</div>
        </div>
        <div class="header-actions">
          <a class="link-btn" href="pesanan.html">Mode Kartu</a>
          <a class="link-btn" href="dashboard.html">Dashboard</a>
          <a class="link-btn" href="keuangan.html">Keuangan</a>
          <button class="logout-btn" id="logoutBtn">Keluar</button>
        </div>
      </div>
    </header>

    <div class="container">
      <div class="status-msg" id="statusMsg"></div>

      <div class="toolbar-row">
        <h2>Pesanan — Spreadsheet</h2>
        <div class="filter-btns" id="filterBtns">
          <button class="filter-btn active" data-status="semua">Semua</button>
          <button class="filter-btn" data-status="Baru">Baru</button>
          <button class="filter-btn" data-status="Diproses">Diproses</button>
          <button class="filter-btn" data-status="Selesai">Selesai</button>
          <button class="filter-btn" data-status="Diambil">Diambil</button>
          <button class="filter-btn" data-status="Batal">Batal</button>
        </div>
        <button class="icon-btn primary" id="addRowBtn">+ Baris</button>
      </div>

      <!-- Desktop: tabel grid -->
      <div class="table-card grid-card" id="gridTableCard">
        <div class="table-xscroll" id="gridTopScroll" aria-hidden="true"><div id="gridTopSpacer"></div></div>
        <div class="table-wrap">
          <table id="gridTable" aria-label="Grid pesanan">
            <thead>
              <tr>
                <th>Produk</th>
                <th>Size</th>
                <th>Cuttingan</th>
                <th>Lengan</th>
                <th>Warna</th>
                <th>Qty</th>
                <th>Total</th>
                <th>Dibayar</th>
                <th>Akun</th>
                <th>Tambah</th>
                <th>Sisa</th>
                <th>Bayar</th>
                <th>Customer</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="gridBody">
              <tr><td colspan="14">Memuat pesanan...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Mobile: kartu stacked -->
      <div id="gridCards"><div class="empty-state">Memuat pesanan...</div></div>

      <!-- Modal riwayat bayar (F2) -->
      <div id="payHistModal" hidden>
        <div class="hist-card" role="dialog" aria-modal="true" aria-labelledby="payHistTitle">
          <div class="hist-head"><h3 id="payHistTitle">Riwayat bayar</h3><button class="icon-btn" id="payHistClose">Tutup</button></div>
          <div id="payHistBody"><div class="empty-state">Memuat...</div></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/admin-core.js?v=9"></script>
  <script src="js/pesanan-grid-data.js"></script>
  <script src="js/pesanan-grid-render.js"></script>
  <script src="js/pesanan-grid-history.js"></script>
  <script src="js/pesanan-grid-edit.js"></script>
  <script src="js/pesanan-grid-details.js"></script>
  <script src="js/pesanan-grid-new.js"></script>
  <script>
    window.requireAuth(GridApp.boot);
  </script>
</body>

</html>
